<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact RahaBlog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #f8f9fa; color: #1a1a2e; line-height: 1.8; }
        h1 { color: #e53e5a; }
        a { color: #e53e5a; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back { margin-top: 30px; display: block; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        button { background: #e53e5a; color: #fff; border: none; padding: 12px 30px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #c73652; }
    </style>
</head>
<body>
    <h1>📬 Contact RahaBlog</h1>
    <p>Have a tip, story idea, or feedback? We'd love to hear from you!</p>
    
    <form>
        <label>Your Name *</label>
        <input type="text" placeholder="Enter your name" required>
        
        <label>Your Email *</label>
        <input type="email" placeholder="Enter your email" required>
        
        <label>Subject</label>
        <input type="text" placeholder="What's this about?">
        
        <label>Message *</label>
        <textarea rows="5" placeholder="Write your message here..." required></textarea>
        
        <button type="submit">Send Message ✉️</button>
    </form>
    
    <a href="/" class="back">← Back to Home</a>
</body>
</html>
